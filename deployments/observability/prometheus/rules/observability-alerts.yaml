groups:
  - name: gateway-observability-alerts
    rules:
      - alert: AlloyStoppedCollecting
        expr: up{job="alloy"} == 0 or absent_over_time(up{job="alloy"}[5m]) == 1 or loki_write_wal_watcher_running{job="alloy"} != 1 or absent_over_time(loki_write_wal_watcher_running{job="alloy"}[5m]) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Alloy is unreachable or its Loki WAL watcher has stopped
      - alert: LokiUnavailable
        expr: up{job="loki"} == 0 or absent_over_time(up{job="loki"}[5m]) == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Loki is unavailable to the collector
      - alert: LokiWriteFailure
        expr: increase(loki_write_dropped_entries_total[5m]) > 0 or increase(loki_write_batch_retries_total[5m]) > 20
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Alloy is retrying or dropping writes to Loki
      - alert: GatewayLogDiskNearlyFull
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/var/log/unio"} / node_filesystem_size_bytes{mountpoint="/var/log/unio"}) > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The filesystem containing Gateway logs is more than 85 percent full

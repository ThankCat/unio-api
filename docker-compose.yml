services:
  postgres:
    image: postgres:16-alpine
    container_name: unio-postgres
    environment:
      POSTGRES_DB: unio
      POSTGRES_USER: unio
      POSTGRES_PASSWORD: unio_dev_password
    ports:
      - "5432:5432"
    volumes:
      # 本地开发数据持久化，避免容器重启后数据丢失。
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unio -d unio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: unio-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      # Redis AOF 数据持久化；计费最终事实仍然不能依赖 Redis。
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  loki:
    image: grafana/loki:3.5.3
    container_name: unio-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./deployments/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - ./deployments/observability/loki/rules:/etc/loki/rules:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: unio-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./deployments/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/unio:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: unio-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deployments/observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deployments/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

volumes:
  postgres_data:
    name: unio_postgres_data
  redis_data:
    name: unio_redis_data
  alloy_data:
    name: unio_alloy_data
  loki_data:
    name: unio_loki_data
  prometheus_data:
    name: unio_prometheus_data

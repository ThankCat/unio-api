version: "2"
sql:
  - engine: postgresql
    schema: "migrations/*.up.sql"
    # 查询按 surface 分目录（gateway/admin/console/worker/shared），仍生成到同一个 sqlc 包。
    queries:
      - "sql/queries/shared"
      - "sql/queries/gateway"
      - "sql/queries/admin"
      - "sql/queries/console"
      - "sql/queries/worker"
    gen:
      go:
        package: sqlc
        out: internal/platform/store/sqlc
        sql_package: pgx/v5

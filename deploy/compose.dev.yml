# 固定 Dev 项目名；容器由 Compose 自动命名，network 和 volume 使用显式资源名。
name: ${COMPOSE_PROJECT_NAME:-unio-dev}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PUBLISHED_PORT:-5432}:5432
    volumes:
      # 本地开发数据持久化，避免容器重启后数据丢失。
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    ports:
      - ${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PUBLISHED_PORT:-6380}:6379
    volumes:
      # Redis AOF 数据持久化；计费最终事实仍然不能依赖 Redis。
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
          else
            redis-cli ping | grep -q PONG
          fi
      interval: 5s
      timeout: 3s
      retries: 10

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.5.3}
    command: ["-config.file=/etc/loki/config.yaml"]
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - ../observability/loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.10.2}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../logs:/var/log/unio:ro
      - alloy-data:/var/lib/alloy/data
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/12345
          printf 'GET /-/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == "HTTP/1.0 200"* || "$$status" == "HTTP/1.1 200"* ]]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: unio-dev-network

volumes:
  postgres-data:
    name: unio-dev-postgres-data
  redis-data:
    name: unio-dev-redis-data
  alloy-data:
    name: unio-dev-alloy-data
  loki-data:
    name: unio-dev-loki-data

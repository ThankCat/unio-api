resolver 127.0.0.11 valid=10s ipv6=off;

upstream gateway_server {
    zone gateway_server 64k;
    server gateway:8520 resolve;
    keepalive 32;
}

upstream admin_server {
    zone admin_server 64k;
    server admin:8521 resolve;
    keepalive 16;
}

upstream console_server {
    zone console_server 64k;
    server console:8522 resolve;
    keepalive 16;
}

# Gateway API：独立域名，便于后续单独做负载均衡。
server {
    listen 8080;
    server_name test-api.unioapi.com;
    server_tokens off;
    client_header_timeout 30s;
    client_body_timeout 60s;
    client_max_body_size 256m;

    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /healthz {
        proxy_pass http://gateway_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        proxy_pass http://gateway_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 非公开运维入口不经过公网 API authority。
    location = /metrics {
        return 404;
    }

    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    # 纯文本接口使用更小的资源边界。Unio 当前尚未实现这两个 origin；预置限制以便
    # 后续接入时与 Gateway 的 GATEWAY_TEXT_MAX_JSON_BODY_MB 保持一致。
    location ~ ^/(?:v1/)?(?:embeddings|alpha/search)/?$ {
        client_max_body_size 32m;
        proxy_pass http://gateway_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    # API authority 下的常规请求统一交给 Gateway Router。Gateway 应用层负责业务路由，
    # 并把缺失或重复的 /v1 前缀规范化为单个 /v1。
    location / {
        proxy_pass http://gateway_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }
}

# Admin 站点：前端静态资源与 Admin API 同源（均为 /v1）。
server {
    listen 8080;
    server_name test-admin.unioapi.com;
    server_tokens off;
    client_header_timeout 30s;
    client_body_timeout 60s;
    root /var/www/admin;
    index index.html;

    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /v1/ {
        client_max_body_size 4m;
        proxy_pass http://admin_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Console 站点：静态资源与认证 API 同源，浏览器令牌仅通过 HttpOnly Cookie 传递。
server {
    listen 8080;
    server_name test-console.unioapi.com;
    server_tokens off;
    client_header_timeout 30s;
    client_body_timeout 60s;
    root /var/www/console;
    index index.html;

    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /v1/ {
        client_max_body_size 1m;
        proxy_pass http://console_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 未匹配 Host 时仅提供探活，避免路径冲突误路由。
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

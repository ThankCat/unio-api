resolver 127.0.0.11 valid=10s ipv6=off;

upstream gateway_server {
    zone gateway_server 64k;
    server gateway:8520 resolve;
    keepalive 32;
}

upstream admin_server {
    zone admin_server 64k;
    server admin:8521 resolve;
    keepalive 16;
}

# Gateway API：独立域名，便于后续单独做负载均衡。
server {
    listen 8080;
    server_name test-api.unioapi.com;
    server_tokens off;

    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /healthz {
        proxy_pass http://gateway_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        proxy_pass http://gateway_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        client_max_body_size 32m;
        proxy_pass http://gateway_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    location / {
        return 404;
    }
}

# Admin 站点：前端静态资源与 Admin API 同源（均为 /v1）。
server {
    listen 8080;
    server_name test-admin.unioapi.com;
    server_tokens off;
    root /var/www/admin;
    index index.html;

    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /v1/ {
        client_max_body_size 4m;
        proxy_pass http://admin_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 未匹配 Host 时仅提供探活，避免路径冲突误路由。
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
